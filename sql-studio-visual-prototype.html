8 12 3 3 5-6"/>',play:'<path d="m8 5 11 7-11 7V5Z"/>',lightbulb:'<path d="M9 18h6m-5 4h4M8 15a7 7 0 1 1 8 0l-1 3H9l-1-3Z"/>',table:'<rect x="3" y="3" width="18" height="18" rx="1"/><path d="M3 9h18M3 15h18M9 3v18"/>',copy:'<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/>',filter:'<path d="M4 7h16M7 12h10m-7 5h4"/>',command:'<path d="M9 7V5a3 3 0 1 0-3 3h13a3 3 0 1 0-3-3v14a3 3 0 1 0 3-3H5a3 3 0 1 0 3 3V5"/>'};
const I=(name,cls='')=>`<svg class="icon ${cls}" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">${icons[name]||icons.file}</svg>`;
const params=new URLSearchParams(location.search);let screen=params.get('screen')||'home';let theme=params.get('theme')||'light';let mobile=params.get('mobile')==='1';document.body.classList.toggle('dark',theme==='dark');
const label={home:'Home',learn:'Learn',understand:'Understanding WHERE',practice:'Practice',projects:'Projects',project:'Video Product Analytics',progress:'Progress'};
const go=(page)=>{let p=new URLSearchParams(location.search);p.set('screen',page);location.search=p.toString()};const setTheme=(t)=>{let p=new URLSearchParams(location.search);p.set('theme',t);location.search=p.toString()};
const nav=[['home','Home','house'],['learn','Learn','book'],['practice','Practice','terminal'],['projects','Projects','folder'],['progress','Progress','chart']];const tools=[['playground','Playground','database'],['lab','Engineering Lab','flask'],['plans','Query Plans','plan'],['dialects','Dialect Guide','file'],['warehouse','Warehouse Blueprint','layers']];
function sidebar(){let items=(a)=>a.map(([p,n,ic])=>`<a class="nav-item ${p===screen||(p==='learn'&&screen==='understand')||(p==='projects'&&screen==='project')?'active':''}" onclick="go('${p}')">${I(ic)}<span>${n}</span></a>`).join('');return `<aside class="sidebar"><div class="brand"><div class="brand-mark">${I('database')}</div> SQL Studio <span style="font-weight:400;color:var(--faint);font-size:10px;margin-left:auto">V2</span></div><nav class="nav">${items(nav)}</nav><div class="nav-section">Tools</div><nav class="nav">${items(tools)}</nav><div class="side-bottom"><a class="nav-item">${I('settings')}<span>Settings</span></a><div class="side-note">Designed for the curious.<br>Learn SQL by doing.</div></div></aside>`}
function topbar(){return `<header class="topbar"><div class="mobile-brand">${I('database')} SQL Studio</div><div class="breadcrumbs"><span>Workspace</span>${I('chevron','small-icon')}<strong>${label[screen]||'SQL Studio'}</strong></div><div class="top-actions"><div class="top-search" onclick="go('learn')">${I('search','small-icon')} Search anything <span class="kbd">⌘ K</span></div><div class="theme-select"><button class="theme-opt ${theme==='light'?'active':''}" onclick="setTheme('light')" title="Light">${I('sun','small-icon')}</button><button class="theme-opt ${theme==='dark'?'active':''}" onclick="setTheme('dark')" title="Dark">${I('moon','small-icon')}</button></div><button class="icon-btn mobile-only" onclick="setTheme('${theme==='light'?'dark':'light'}')">${I(theme==='light'?'moon':'sun')}</button><button class="icon-btn">${I('more')}</button><div class="avatar">KS</div></div></header>`}
function bottomnav(){return `<nav class="mobile-bottom">${nav.map(([p,n,ic])=>`<a onclick="go('${p}')" class="mobile-nav-item ${p===screen||(p==='learn'&&screen==='understand')?'active':''}">${I(ic)}<span>${n}</span></a>`).join('')}</nav>`}
const mods=[['SQL Foundations','Start querying, understanding tables and writing SELECT.',8,100,'Mastered'],['Filtering & Sorting','Find exactly the data you need with WHERE and ORDER BY.',10,65,'In progress'],['Calculations & Data Quality','Work with aggregations, nulls and useful data checks.',9,20,'In progress'],['Joins & Relationships','Connect information across multiple tables.',10,0,'Not started'],['Dates & Subqueries','Work with time and build nested SQL queries.',9,0,'Not started'],['Window Functions','Analyze values across partitions and sequences.',9,0,'Not started'],['Product Analytics','Translate business questions into SQL.',8,0,'Not started'],['Database Engineering','Build tables, constraints, views and transactions.',9,0,'Not started'],['Query Performance','Understand query plans and practical indexing.',8,0,'Not started'],['Warehousing & Projects','Design transformations and reporting layers.',8,0,'Not started']];
function moduleRow(m,i){return `<div class="index-row" onclick="go('understand')"><span class="module-id">${String(i+1).padStart(2,'0')}</span><div><div class="index-title">${m[0]}</div><div class="index-desc">${m[1]}</div></div><div class="index-meta">${m[2]} lessons · ${m[4]}</div><div class="right-progress"><div class="progress-track"><div class="progress-fill" style="width:${m[3]}%"></div></div><span class="pct">${m[3]}%</span></div><span class="row-end">${I('chevron','small-icon')}</span></div>`}
function home(){return `<div class="content"><main class="canvas"><section class="hero"><div><div class="eyebrow">THE WORKSPACE FOR LEARNING SQL</div><h1>Learn SQL.<br>Think in data.</h1><p class="lead">Go from your first SELECT to real analytical work. Understand each concept, write queries, and build with confidence.</p><div class="actions"><button class="btn primary" onclick="go('understand')">Continue learning ${I('arrow')}</button><button class="btn ghost" onclick="go('learn')">Explore curriculum ${I('uparrow')}</button></div></div><div class="meta-right"><div class="big-stat">12<span class="stat-muted"> / 88</span></div><div style="font-size:12px;color:var(--muted);margin-top:12px">Concepts mastered</div><div style="height:3px;background:var(--border);margin-top:21px;width:140px;margin-left:auto"><div style="width:14%;height:100%;background:var(--accent)"></div></div></div></section><div class="section-head"><h2>Pick up where you left off</h2><span class="cap">YOUR ACTIVE LESSON</span></div><div class="continue"><div class="continue-main"><span class="module-id">02 / FILTERING & SORTING</span><div class="continue-title">Filter rows with WHERE</div><div class="continue-info">Practice · Challenge 2 of 2 · Your SQL is saved</div></div><button class="btn" onclick="go('practice')">Open workspace ${I('arrow')}</button></div><div class="section-head"><h2>Your learning path</h2><a class="subtle-link" onclick="go('learn')">View all modules ${I('arrow','small-icon')}</a></div><div class="index-table">${mods.slice(0,4).map(moduleRow).join('')}</div><div class="section-head"><h2>Next recommended action</h2></div><div class="row-line"><span style="display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px">${I('clock')} Review GROUP BY before moving to joins</span><a class="subtle-link" onclick="go('practice')">Review concept ${I('arrow','small-icon')}</a></div></main></div>`}
function learn(){return `<div class="content"><main class="canvas"><div class="eyebrow">THE CURRICULUM</div><h1 style="font-size:43px;margin-top:15px">Your SQL learning path.</h1><p class="lead">Structured, practical, and project-driven. Master the fundamentals before diving into real analytical and engineering problems.</p><div class="searchline"><div class="line-search">${I('search','small-icon')} Search concepts, lessons or modules...</div><div class="filter-links"><span class="chosen">All modules</span><span>In progress</span><span>Mastered</span>${I('filter','small-icon')}</div></div><div style="display:flex;align-items:end;justify-content:space-between;margin:26px 0 14px"><h2>Course modules</h2><span class="cap">12 OF 88 LESSONS MASTERED</span></div><div class="index-table">${mods.map(moduleRow).join('')}</div></main></div>`}
function stageBar(current){let stages=['Understand','Practice','Review','Complete'];return `<div class="stage-wrap">${stages.map((s,i)=>`<div class="stage ${i===current?'active':i<current?'complete':''}"><span class="stage-num">${i<current?I('check','small-icon'):i+1}</span>${s}</div>`).join('')}</div>`}
function lessonTop(active){return `<div class="lesson-top"><div class="lesson-hdr"><div><div class="eyebrow" style="margin-bottom:9px">02 / FILTERING & SORTING</div><h2>Filter rows with WHERE</h2></div><span class="small-status">Lesson 04 of 88 &nbsp; · &nbsp; Beginner</span></div>${stageBar(active)}</div>`}
function understand(){return `<div class="content"><div class="lesson">${lessonTop(0)}<article class="lesson-content"><div class="lesson-article"><div class="eyebrow">UNDERSTAND THE CONCEPT</div><h1>Ask for exactly<br>the rows you need.</h1><p class="lead">A database table can contain thousands of rows. The <code style="color:var(--accent)">WHERE</code> clause helps you return only the records that match a condition.</p><section class="lesson-section"><h2>See WHERE in action</h2><p class="body-copy">Imagine a customers table containing people from different cities. To see only customers from Chicago, add a condition after <code>FROM</code>.</p><div class="example-split"><div class="example-half"><div class="pane-head"><span>EXAMPLE QUERY · SQLITE</span><span style="color:var(--accent)">${I('play','small-icon')} &nbsp; Run example</span></div><div class="source"><span class="kw">SELECT</span> name, city\n<span class="kw">FROM</span> customers\n<span class="kw">WHERE</span> city = <span class="str">'Chicago'</span>;</div></div><div class="example-half"><div class="pane-head"><span>RESULT · 3 ROWS</span>${I('table','small-icon')}</div><table class="results-table"><thead><tr><th>name</th><th>city</th></tr></thead><tbody><tr><td>Amelia Reed</td><td>Chicago</td></tr><tr><td>Daniel Park</td><td>Chicago</td></tr><tr><td>Sofia Chen</td><td>Chicago</td></tr></tbody></table></div></div></section><div class="callout-line"><strong>Remember:</strong> WHERE filters individual rows before grouping. SQL evaluates the condition and keeps only matching records.</div><section class="lesson-section" style="margin-top:32px"><h2>Common mistake</h2><p class="body-copy">Text values need quotation marks. Write <code>city = 'Chicago'</code>, not <code>city = Chicago</code>.</p></section><div class="article-footer"><span class="subtle-link">${I('lightbulb')} See it step by step</span><button class="btn primary" onclick="go('practice')">Try it yourself ${I('arrow')}</button></div></div></article></div></div>`}
function task(){return `<aside class="task"><div class="label">CHALLENGE 02 / 02</div><h2>Find customers<br>in Chicago.</h2><p>Write a query that returns the name and city of customers who live in Chicago.</p><div class="task-divider"></div><div class="mini-head">WHAT TO RETURN</div><ul class="rules"><li>Only customers from Chicago</li><li>Columns: <b>name</b> and <b>city</b></li><li>Sort results by name</li></ul><div class="task-divider"></div><div class="mini-head">AVAILABLE DATA</div><div class="schema-table">${I('table')} <strong>customers</strong> ${I('down','small-icon')}</div><div class="schema-columns">id &nbsp; integer<br>name &nbsp; text<br>city &nbsp; text<br>created_at &nbsp; date</div><div class="task-foot"><div class="hint-link">${I('lightbulb')} Need a hint? ${I('arrow','small-icon')}</div><div class="progress-mini">1 of 2 independent solves completed</div></div><div class="task-hint" style="display:none"><span class="subtle-link">${I('table','small-icon')} View schema</span><span class="hint-link">${I('lightbulb','small-icon')} Hint</span></div></aside>`}
function practice(){return `<div class="content" style="display:flex;flex-direction:column;padding-bottom:0"><div class="lesson" style="min-height:0;overflow:hidden">${lessonTop(1)}<div class="practice">${task()}<div class="editor-area"><div class="edit-head"><span class="file-label"><span class="file-dot"></span>challenge_02.sql</span><div class="editor-toolbar"><span>${I('copy','small-icon')} &nbsp; Copy</span><span>${I('table','small-icon')} &nbsp; Schema</span><span>${I('more','small-icon')}</span></div></div><div class="edit-box"><div class="linenos">1<br>2<br>3<br>4<br>5<br>6</div><div class="sql-content"><span class="com">-- Customers located in Chicago</span>\n<span class="kw">SELECT</span> name, city\n<span class="kw">FROM</span> customers\n<span class="kw">WHERE</span> city = <span class="str">'Chicago'</span>\n<span class="kw">ORDER BY</span> name;\n</div></div><div class="edit-actions"><span class="editor-note">SQLite · Autosaved just now</span><div class="actionset"><button class="btn">${I('play')} Run query</button><button class="btn primary">${I('check')} Check answer</button></div></div><div class="editor-results"><div class="tabbar"><div class="tab active">Results</div><div class="tab">Feedback</div><div class="tab">Query plan</div></div><div class="result-meta">${I('checkcircle','small-icon')} Query executed successfully <span style="opacity:.5">·</span> 3 rows returned <span style="opacity:.5">·</span> SQLite</div><div class="results-grid"><table class="results-table"><thead><tr><th style="width:42px">#</th><th>name</th><th>city</th></tr></thead><tbody><tr><td style="color:var(--faint)">1</td><td>Amelia Reed</td><td>Chicago</td></tr><tr><td style="color:var(--faint)">2</td><td>Daniel Park</td><td>Chicago</td></tr><tr><td style="color:var(--faint)">3</td><td>Sofia Chen</td><td>Chicago</td></tr></tbody></table></div><div class="result-meta" style="padding-top:17px">Check Answer to grade your result and earn mastery.</div></div></div></div></div></div>`}
const projects=[['Video Product Analytics','Measure engagement, retention, rolling trends and top-performing content.','Intermediate','4 milestones','Resume project'],['Social Product Analytics','Explore sessions, funnels, experiments and customer behavior.','Intermediate','5 milestones','Start project'],['AI Platform Economics','Investigate reliability, model costs and payment reconciliation.','Advanced','5 milestones','Start project'],['Warehouse & Reporting','Design Bronze → Silver → Gold data and reporting layers.','Advanced','5 milestones','Start project'],['CRM + ERP Integration','Create source-of-truth logic, quality gates and analytical models.','Advanced','6 milestones','Start project']];
function projectsPage(){return `<div class="content"><main class="canvas"><div class="eyebrow">REAL WORK. REAL SQL.</div><h1 style="font-size:45px">Build something<br>with what you know.</h1><p class="lead">Take the skills from your lessons into realistic product, analytics and data engineering problems. Work through milestones, save queries and build deliverables.</p><div class="section-head" style="margin-top:48px"><h2>Guided case studies</h2><span class="cap">05 PROJECTS</span></div><div style="border-top:1px solid var(--border)">${projects.map((p,i)=>`<div class="projects-row" onclick="go('project')"><span class="project-number">0${i+1}</span><div><h3>${p[0]}</h3><p class="index-desc">${p[1]}</p></div><span class="index-meta">${p[2]}<br><span style="color:var(--faint)">${p[3]}</span></span><span class="small-status">${p[4]}</span>${I('arrow','small-icon')}</div>`).join('')}</div><div class="row-line" style="margin-top:28px"><span class="section-copy">Explore how warehouse layers fit together.</span><span class="subtle-link">View warehouse blueprint ${I('arrow','small-icon')}</span></div></main></div>`}
function projectPage(){return `<div class="content" style="padding-bottom:0"><main class="canvas"><div class="eyebrow">PROJECT 01 / VIDEO PRODUCT ANALYTICS</div><h1>Understand what<br>keeps viewers watching.</h1><p class="lead">You're an analyst on a video platform. Use SQL to find retention trends, rank content and investigate how engagement changes over time.</p><div class="section-head" style="margin-top:43px"><h2>Project milestones</h2><span class="cap">01 OF 04 COMPLETED</span></div><div class="index-table">${['Explore the video events dataset','Measure views and engagement','Build rolling performance trends','Present retention findings'].map((n,i)=>`<div class="index-row" style="grid-template-columns:60px 1fr 130px 22px" onclick="go('practice')"><span class="module-id">0${i+1}</span><div><div class="index-title">${n}</div><div class="index-desc">${['Understand the source tables and relationships','Aggregate events into useful product metrics','Compare content performance over time','Produce the project SQL deliverable'][i]}</div></div><div class="index-meta">${i===0?'Completed':i===1?'In progress':'Not started'}</div>${I(i===0?'check':'chevron','small-icon')}</div>`).join('')}</div><div class="section-head"><h2>Your deliverables</h2></div><div class="row-line"><span class="section-copy">${I('file','small-icon')} &nbsp; Project SQL queries are saved as you complete milestones.</span><span class="subtle-link">View saved work ${I('arrow','small-icon')}</span></div></main></div>`}
function progress(){let skills=[['SQL Foundations',100],['Filtering & Sorting',65],['Calculations & Quality',20],['Joins & Relationships',0],['Dates & Subqueries',0],['Window Functions',0],['Product Analytics',0],['Database Engineering',0]];return `<div class="content"><main class="canvas"><div class="eyebrow">YOUR LEARNING HISTORY</div><h1>Progress you<br>can build on.</h1><p class="lead">A clear picture of what you've mastered, what needs another look, and where to go next.</p><div class="progress-statrow" style="margin-top:41px"><div><div class="stat-number">12 <span class="stat-muted">/ 88</span></div><div class="stat-caption">Concepts mastered</div></div><div><div class="stat-number">28</div><div class="stat-caption">Independent solves</div></div><div><div class="stat-number">03</div><div class="stat-caption">Reviews due</div></div><div><div class="stat-number">01 <span class="stat-muted">/ 05</span></div><div class="stat-caption">Projects in progress</div></div></div><div class="skill-list"><section><div class="section-head"><h2>Concept mastery</h2><a class="subtle-link" onclick="go('learn')">All lessons ${I('arrow','small-icon')}</a></div><div style="border-top:1px solid var(--border)">${skills.map(s=>`<div class="skills-row"><span class="skill-name">${s[0]}</span><div class="progress-track" style="width:95px"><div class="progress-fill" style="width:${s[1]}%"></div></div><span class="pct">${s[1]}%</span></div>`).join('')}</div><div class="section-head" style="margin-top:35px"><h2>Recent learning</h2></div><div class="record">${I('checkcircle','small-icon')} Solved WHERE independently <span style="margin-left:auto">Today</span></div><div class="record">${I('checkcircle','small-icon')} Mastered ORDER BY <span style="margin-left:auto">Yesterday</span></div></section><aside class="aside-rail"><div class="section-head"><h2>Review queue</h2></div><div class="review-row"><strong>GROUP BY fundamentals</strong><p>Review due today · Aggregations</p><a class="subtle-link" onclick="go('practice')">Practice now ${I('arrow','small-icon')}</a></div><div class="review-row"><strong>Sorting and LIMIT</strong><p>Review due today · Filtering</p><a class="subtle-link" onclick="go('practice')">Practice now ${I('arrow','small-icon')}</a></div><div class="review-row"><strong>Handling NULL values</strong><p>Recommended refresher</p><a class="subtle-link" onclick="go('practice')">Practice now ${I('arrow','small-icon')}</a></div><div style="margin-top:45px"><h2 style="margin-bottom:15px">Your next move</h2><p class="body-copy" style="font-size:12px;margin:0 0 19px">Finish your current filtering challenge, then continue toward joins and relationships.</p><button class="btn primary" onclick="go('practice')">Continue lesson ${I('arrow')}</button></div></aside></div></main></div>`}
let display= screen==='home'?home():screen==='learn'?learn():screen==='understand'?understand():screen==='practice'?practice():screen==='projects'?projectsPage():screen==='project'?projectPage():screen==='progress'?progress():learn();document.getElementById('root').innerHTML=`<div class="app">${sidebar()}<div class="work">${topbar()}${display}</div>${bottomnav()}</div>`;
</script>
</body></html>
